<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高级学生座位排列系统 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdncdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- Tailwind配置 - 与主系统保持一致 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#36CFC9',
            accent: '#FF7D00',
            light: '#F5F7FA',
            dark: '#1D2129'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .form-input-focus {
        @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
      }
      .btn-primary {
        @apply bg-primary text-white font-medium py-3 px-6 rounded-lg shadow-md hover:shadow-lg hover:bg-primary/90 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0;
      }
      .btn-secondary {
        @apply bg-white text-primary border border-primary font-medium py-3 px-6 rounded-lg shadow-sm hover:shadow-md hover:bg-primary/5 transition-all duration-300;
      }
      .card-hover {
        @apply transition-all duration-500 hover:shadow-xl;
      }
      .input-icon {
        @apply absolute left-3 top-1/2 -translate-y-1/2 text-gray-400;
      }
      .toggle-icon {
        @apply absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer transition-colors hover:text-primary;
      }
    }
  </style>
</head>
<body class="font-inter bg-gradient-to-br from-light to-gray-100 min-h-screen flex items-center justify-center p-4">
  <!-- 主容器 -->
  <div class="w-full max-w-6xl">
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="flex flex-col md:flex-row">
        <!-- 左侧图片区域 -->
        <div class="md:w-1/2 bg-primary p-8 md:p-12 flex flex-col justify-center text-white relative overflow-hidden">
          <!-- 背景装饰 -->
          <div class="absolute top-0 left-0 w-full h-full opacity-10">
            <div class="absolute top-10 left-10 w-40 h-40 rounded-full bg-white"></div>
            <div class="absolute bottom-20 right-10 w-60 h-60 rounded-full bg-white"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-white"></div>
          </div>

          <div class="relative z-10">
            <div class="mb-8">
              <div class="flex items-center space-x-2 mb-6">
                <i class="fa fa-graduation-cap text-3xl"></i>
                <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold">高级学生座位排列系统</h1>
              </div>
              <p class="text-white/80 text-lg max-w-md">智能、高效的座位管理解决方案，让课堂安排更加科学合理</p>
            </div>

            <div class="space-y-6 mt-12">
              <div class="flex items-start space-x-4">
                <div class="bg-white/20 p-3 rounded-lg">
                  <i class="fa fa-random text-xl"></i>
                </div>
                <div>
                  <h3 class="text-xl font-semibold mb-1">智能随机排列</h3>
                  <p class="text-white/70">基于多种条件的智能随机算法，满足不同场景需求</p>
                </div>
              </div>

              <div class="flex items-start space-x-4">
                <div class="bg-white/20 p-3 rounded-lg">
                  <i class="fa fa-users text-xl"></i>
                </div>
                <div>
                  <h3 class="text-xl font-semibold mb-1">灵活分组管理</h3>
                  <p class="text-white/70">支持多组划分，满足不同规模班级的座位安排</p>
                </div>
              </div>

              <div class="flex items-start space-x-4">
                <div class="bg-white/20 p-3 rounded-lg">
                  <i class="fa fa-history text-xl"></i>
                </div>
                <div>
                  <h3 class="text-xl font-semibold mb-1">历史记录追踪</h3>
                  <p class="text-white/70">保存历史座位安排，方便随时查看和恢复</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 右侧表单区域 -->
        <div class="md:w-1/2 p-8 md:p-12">
          <div class="max-w-md mx-auto">
            <!-- 表单切换标题 -->
            <div class="mb-10">
              <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-2" id="formTitle">欢迎登录</h2>
              <p class="text-gray-500" id="formSubtitle">请输入您的账号信息</p>
            </div>

            <!-- 表单容器 -->
            <div class="form-container relative">
              <!-- 登录表单 -->
              <form id="loginForm" class="form-panel">
                <div class="space-y-5">
                  <!-- 邮箱/用户名 -->
                  <div class="relative">
                    <i class="fa fa-user input-icon"></i>
                    <input type="text" placeholder="用户名或邮箱"
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg form-input-focus transition-colors"
                           required>
                  </div>

                  <!-- 密码 -->
                  <div class="relative">
                    <i class="fa fa-lock input-icon"></i>
                    <input type="password" placeholder="密码" id="loginPassword"
                           class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg form-input-focus transition-colors"
                           required>
                    <i class="fa fa-eye toggle-icon" id="toggleLoginPassword"></i>
                  </div>

                  <!-- 记住我和忘记密码 -->
                  <div class="flex justify-between items-center">
                    <label class="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                      <span class="text-gray-600 text-sm">记住我</span>
                    </label>
                    <a href="#" class="text-primary text-sm hover:underline transition-colors">忘记密码?</a>
                  </div>

                  <!-- 登录按钮 -->
                  <button type="submit" class="w-full btn-primary flex items-center justify-center space-x-2">
                    <i class="fa fa-sign-in"></i>
                    <span>登录</span>
                  </button>

                  <!-- 分隔线 -->
                  <div class="relative flex items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-sm">或使用以下方式登录</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                  </div>

                  <!-- 社交登录 -->
                  <div class="flex justify-center space-x-4">
                    <button type="button" class="w-12 h-12 rounded-full border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-50 hover:text-primary hover:border-primary/50 transition-all">
                      <i class="fa fa-qq"></i>
                    </button>
                    <button type="button" class="w-12 h-12 rounded-full border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-50 hover:text-primary hover:border-primary/50 transition-all">
                      <i class="fa fa-weixin"></i>
                    </button>
                    <button type="button" class="w-12 h-12 rounded-full border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-50 hover:text-primary hover:border-primary/50 transition-all">
                      <i class="fa fa-github"></i>
                    </button>
                  </div>
                </div>
              </form>

              <!-- 注册表单 -->
              <form id="registerForm" class="form-panel absolute inset-0 opacity-0 pointer-events-none">
                <div class="space-y-5">
                  <!-- 用户名 -->
                  <div class="relative">
                    <i class="fa fa-user input-icon"></i>
                    <input type="text" placeholder="用户名"
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg form-input-focus transition-colors"
                           required>
                  </div>

                  <!-- 邮箱 -->
                  <div class="relative">
                    <i class="fa fa-envelope input-icon"></i>
                    <input type="email" placeholder="邮箱地址"
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg form-input-focus transition-colors"
                           required>
                  </div>

                  <!-- 密码 -->
                  <div class="relative">
                    <i class="fa fa-lock input-icon"></i>
                    <input type="password" placeholder="设置密码" id="registerPassword"
                           class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg form-input-focus transition-colors"
                           required>
                    <i class="fa fa-eye toggle-icon" id="toggleRegisterPassword"></i>
                  </div>

                  <!-- 确认密码 -->
                  <div class="relative">
                    <i class="fa fa-lock input-icon"></i>
                    <input type="password" placeholder="确认密码" id="confirmPassword"
                           class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg form-input-focus transition-colors"
                           required>
                    <i class="fa fa-eye toggle-icon" id="toggleConfirmPassword"></i>
                  </div>

                  <!-- 同意条款 -->
                  <label class="flex items-start space-x-2 cursor-pointer">
                    <input type="checkbox" class="h-4 w-4 mt-1 text-primary focus:ring-primary border-gray-300 rounded" required>
                    <span class="text-gray-600 text-sm">我已阅读并同意<a href="#" class="text-primary hover:underline">用户协议</a>和<a href="#" class="text-primary hover:underline">隐私政策</a></span>
                  </label>

                  <!-- 注册按钮 -->
                  <button type="submit" class="w-full btn-primary flex items-center justify-center space-x-2">
                    <i class="fa fa-user-plus"></i>
                    <span>注册账号</span>
                  </button>
                </div>
              </form>
            </div>

            <!-- 切换表单链接 -->
            <div class="mt-10 text-center">
              <p class="text-gray-600">
                <span id="toggleText">还没有账号?</span>
                <button id="toggleFormBtn" class="text-primary font-medium ml-1 hover:underline transition-colors">
                  立即注册
                </button>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer class="mt-8 text-center text-gray-500 text-sm">
      <p>&copy; 2023 高级学生座位排列系统 版权所有</p>
    </footer>
  </div>

  <!-- 通知提示 -->
  <div id="notification" class="fixed top-5 right-5 bg-dark text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] transition-all duration-300 flex items-center space-x-2 z-50">
    <i class="fa fa-check-circle text-green-400"></i>
    <span>操作成功</span>
  </div>

  <script>
    // DOM元素
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const toggleFormBtn = document.getElementById('toggleFormBtn');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const toggleText = document.getElementById('toggleText');
    const notification = document.getElementById('notification');

    // 密码显示切换
    const togglePasswords = [
      { input: 'loginPassword', toggle: 'toggleLoginPassword' },
      { input: 'registerPassword', toggle: 'toggleRegisterPassword' },
      { input: 'confirmPassword', toggle: 'toggleConfirmPassword' }
    ];

    togglePasswords.forEach(item => {
      const input = document.getElementById(item.input);
      const toggle = document.getElementById(item.toggle);

      if (input && toggle) {
        toggle.addEventListener('click', () => {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
          toggle.classList.toggle('fa-eye');
          toggle.classList.toggle('fa-eye-slash');
        });
      }
    });

    // 切换登录/注册表单
    let isLoginForm = true;

    toggleFormBtn.addEventListener('click', () => {
      if (isLoginForm) {
        // 切换到注册表单
        loginForm.classList.add('opacity-0', 'pointer-events-none');
        loginForm.classList.remove('opacity-100', 'pointer-events-auto');

        setTimeout(() => {
          registerForm.classList.remove('opacity-0', 'pointer-events-none');
          registerForm.classList.add('opacity-100', 'pointer-events-auto');

          formTitle.textContent = '创建账号';
          formSubtitle.textContent = '填写以下信息完成注册';
          toggleText.textContent = '已有账号?';
          toggleFormBtn.textContent = '立即登录';

          isLoginForm = false;
        }, 300);
      } else {
        // 切换到登录表单
        registerForm.classList.add('opacity-0', 'pointer-events-none');
        registerForm.classList.remove('opacity-100', 'pointer-events-auto');

        setTimeout(() => {
          loginForm.classList.remove('opacity-0', 'pointer-events-none');
          loginForm.classList.add('opacity-100', 'pointer-events-auto');

          formTitle.textContent = '欢迎登录';
          formSubtitle.textContent = '请输入您的账号信息';
          toggleText.textContent = '还没有账号?';
          toggleFormBtn.textContent = '立即注册';

          isLoginForm = true;
        }, 300);
      }
    });

    // 表单提交处理
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      showNotification('登录成功，正在跳转...');

      // 模拟登录成功后跳转
      setTimeout(() => {
        window.location.href = 'class.html'; // 假设主页面为class.html
      }, 1500);
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showNotification('两次输入的密码不一致', 'error');
        return;
      }

      showNotification('注册成功，请登录...');

      // 注册成功后切换到登录表单
      setTimeout(() => {
        toggleFormBtn.click();
      }, 1500);
    });

    // 显示通知
    function showNotification(message, type = 'success') {
      const icon = notification.querySelector('i');
      const text = notification.querySelector('span');

      text.textContent = message;

      // 设置图标
      if (type === 'error') {
        icon.className = 'fa fa-times-circle text-red-400';
      } else if (type === 'warning') {
        icon.className = 'fa fa-exclamation-triangle text-yellow-400';
      } else {
        icon.className = 'fa fa-check-circle text-green-400';
      }

      // 显示通知
      notification.classList.remove('opacity-0', 'translate-y-[-20px]');
      notification.classList.add('opacity-100', 'translate-y-0');

      // 3秒后隐藏
      setTimeout(() => {
        notification.classList.remove('opacity-100', 'translate-y-0');
        notification.classList.add('opacity-0', 'translate-y-[-20px]');
      }, 3000);
    }

    // 页面加载动画
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('opacity-100');
      document.body.classList.remove('opacity-0');
    });
  </script>
</body>
</html>
